<script>
    const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTY7KHsuN6HDxt-xp4mH52cU_iW0x9yJB043eVr9lw8tcASVJeyoMq7lwCl2J6WTM_nBQQz-PgQVxFU/pub?output=csv";
    const WHATSAPP = "549388XXXXXXX"; // tu número

    fetch(URL_CSV)
    .then(res => res.text())
    .then(data => {
        const filas = data.split("\n").slice(1);
        const contenedor = document.getElementById("productos");

        filas.forEach(fila => {
          const cols = fila.split(",");
          const [numero, nombre, cant, precioUnit, uniFardo, precioFardo] = cols;
          const stock = parseInt(cant) || 0;
          if(!nombre) return;

          let alerta = "";
          let botones = "";

          if(stock <= 0){
            alerta = `<p style="color:red; font-weight:bold;">❌ SIN STOCK</p>`;
            botones = `<button disabled style="background:#ccc; padding:10px; border:none; border-radius:8px; width:100%;">Sin Stock</button>`;
          } else {
            if(stock <= 5) alerta = `<p style="color:orange; font-weight:bold;">⚠️ Últimas ${stock} unidades!</p>`;

            botones = `
              <a class="btn" style="background:#3498db;" href="https://wa.me/${WHATSAPP}?text=Hola! Quiero ${nombre} por UNIDAD $${precioUnit}" target="_blank">Comprar x Unidad: $${precioUnit}</a>
              <a class="btn" style="background:#27ae60;" href="https://wa.me/${WHATSAPP}?text=Hola! Quiero ${nombre} por FARDO x${uniFardo} $${precioFardo}" target="_blank">Comprar x Fardo x${uniFardo}: $${precioFardo}</a>
              <a class="btn" style="background:#e67e22;" href="https://wa.me/${WHATSAPP}?text=Hola! Quiero consultar promos de ${nombre}" target="_blank">Consultar Promos</a>
            `;
          }

          contenedor.innerHTML += `
            <div class="producto">
              <h3>${nombre}</h3>
              ${alerta}
              <div style="display:flex; flex-direction:column; gap:8px; margin-top:10px;">
                ${botones}
              </div>
            </div>
          `;
        });
      });
  </script>

<style>
.btn { display:block; color:white; padding:10px; border-radius:8px; text-decoration:none; font-weight:bold; text-align:center; }
.btn:hover { opacity:0.9; }
</style>
