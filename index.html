<script>
    const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTY7KHsuN6HDxt-xp4mH52cU_iW0x9yJB043eVr9lw8tcASVJeyoMq7lwCl2J6WTM_nBQQz-PgQVxFU/pub?output=csv";
    const WHATSAPP = "549387XXXXXXX"; // <--- CAMBIA TU NUMERO

    fetch(URL_CSV)
   .then(r => r.text())
   .then(data => {
        const filas = data.split("\n");
        const contenedor = document.getElementById("productos");
        contenedor.innerHTML = "";

        for(let i=1; i<filas.length; i++){
            if(!filas[i]) continue;
            const c = filas[i].split(",");
            if(c.length < 4) continue;

            const nombre = c[1];
            const cant = parseInt(c[2]) || 0;
            const precioUnidad = c[3];
            const uniCaja = c[4];
            const precioCaja = c[5];

            if(!nombre || nombre.trim() === "" || nombre.includes("Nombre")) continue;

            let estado = "";
            if(cant <= 0) estado = `<span style="color:red; font-weight:bold;">❌ SIN STOCK</span>`;
            else if(cant <= 10) estado = `<span style="color:orange; font-weight:bold;">⚠️ Quedan ${cant}</span>`;
            else estado = `<span style="color:green;">✅ Stock: ${cant}</span>`;

            let botones = "";
            if(cant <= 0){
                botones = `<button disabled style="width:100%; padding:10px; background:#ccc; border-radius:8px; border:none;">Sin Stock</button>`;
            } else {
                botones = `
                    <div style="background:#f5f5f5; padding:8px; border-radius:8px;">
                        <p>Por Unidad: <b>$${precioUnidad}</b></p>
                        <p>Por Fardo x${uniCaja}: <b>$${precioCaja}</b></p>
                    </div>
                    <a href="https://wa.me/${WHATSAPP}?text=Hola! Quiero ${nombre} x Unidad $${precioUnidad}" target="_blank" style="display:block; background:#3498db; color:white; padding:10px; text-align:center; border-radius:8px; text-decoration:none; margin-top:6px;">Comprar x Unidad</a>
                    <a href="https://wa.me/${WHATSAPP}?text=Hola! Quiero ${nombre} x Fardo $${precioCaja}" target="_blank" style="display:block; background:#27ae60; color:white; padding:10px; text-align:center; border-radius:8px; text-decoration:none; margin-top:6px;">Comprar x Fardo</a>
                    <a href="https://wa.me/${WHATSAPP}?text=Hola! Consulto promos de ${nombre}" target="_blank" style="display:block; background:#e67e22; color:white; padding:10px; text-align:center; border-radius:8px; text-decoration:none; margin-top:6px;">Consultar Promos</a>
                `;
            }

            contenedor.innerHTML += `<div style="border:1px solid #eee; padding:12px; border-radius:12px; background:white; box-shadow:0 2px 5px rgba(0,0,0,0.05);"><h3 style="margin:0;">${nombre}</h3>${estado}<div style="margin-top:8px;">${botones}</div></div>`;
        }
    });
</script>
