<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Distribuidora</title>
<style>
body{font-family:system-ui;background:#f5f5f5;margin:0;padding:10px}
.header{position:sticky;top:0;background:white;padding:10px;z-index:10;box-shadow:0 2px 5px rgba(0,0,0,.1);border-radius:10px}
#buscador{width:100%;padding:12px;border-radius:20px;border:1px solid #ddd;margin-top:10px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.card{background:white;padding:10px;border-radius:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.btn{border:none;padding:8px 10px;border-radius:20px;cursor:pointer;margin:2px}
.btn-u{background:#25D366;color:white}.btn-f{background:#111;color:white}.btn-promo{background:#ffb100;color:black;width:100%;margin-top:5px}
.qty{display:flex;justify-content:center;align-items:center;gap:8px;margin:5px}
.total-box{position:fixed;bottom:0;left:0;right:0;background:#111;color:white;padding:15px;text-align:center;border-radius:20px 20px 0 0}
</style>
</head>
<body>
<div class="header">
<h3 style="margin:0">Catálogo 🥔</h3>
<input type="text" id="nombre" placeholder="Tu Nombre" style="width:48%;padding:8px">
<input type="text" id="direccion" placeholder="Dirección" style="width:48%;padding:8px">
<input type="text" id="buscador" placeholder="🔍 Buscar producto... Ej: Coca, Papa Semix" onkeyup="filtrar()">
</div>
<div id="catalogo" class="grid"></div>
<div style="height:120px"></div>
<div class="total-box">
<div id="resumen"></div>
<div id="total"></div>
<button onclick="confirmarEnvio()" style="width:100%;padding:12px;background:#25D366;border:none;border-radius:20px;color:white;font-size:18px;margin-top:8px">Enviar pedido por WhatsApp</button>
</div>

<script>
const URL_SHEETS = "PEGA ACA TU LINK DE GOOGLE SHEETS CSV";
let productos = [];
let carrito = {};

async function cargar(){
  const r = await fetch(URL_SHEETS); const t = await r.text();
  const filas = t.split("\n").slice(1);
  productos = filas.map(f=>{
    const c = f.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
    return { numero:c[0]?.replace(/"/g,""), nombre:c[1]?.replace(/"/g,""), unidad:parseFloat(c[2]||0), unidadesFardo:parseFloat(c[3]||6), stock:parseFloat(c[4]||0) }
  }).filter(p=>p.stock>0);
  renderizar(productos);
}
function renderizar(lista){
  document.getElementById("catalogo").innerHTML = lista.map(p=>{
    const qU = carrito[p.numero+"-U"]||0; const qF = carrito[p.numero+"-F"]||0; const qP = carrito[p.numero+"-P"]||0;
    const precioFardo = Math.round(p.unidad * p.unidadesFardo * 0.9);
    return `<div class="card"><b>${p.nombre}</b><br><small>Stock: ${p.stock}</small><br>
      <small>Unidad: $${p.unidad}</small><br>
      <div class="qty"><button onclick="cambiar('${p.numero}','U',-1)">-</button><span>${qU}</span><button onclick="cambiar('${p.numero}','U',1)">+</button></div>
      <button class="btn btn-u" onclick="cambiar('${p.numero}','U',1)">Unidad $${p.unidad}</button>
      <div class="qty"><button onclick="cambiar('${p.numero}','F',-1)">-</button><span>${qF}</span><button onclick="cambiar('${p.numero}','F',1)">+</button></div>
      <button class="btn btn-f" onclick="cambiar('${p.numero}','F',1)">Fardo x${p.unidadesFardo} $${precioFardo} (10% OFF)</button>
      <div class="qty"><button onclick="cambiar('${p.numero}','P',-1)">-</button><span>${qP}</span><button onclick="cambiar('${p.numero}','P',1)">+</button></div>
      <button class="btn btn-promo" onclick="cambiar('${p.numero}','P',1)">Agregar Promo</button><br><small style="color:#b58900;">Consultar con el vendedor</small>
    </div>`
  }).join("");
  actualizarTotal();
}
function cambiar(num,tipo,delta){
  const key = num+"-"+tipo; carrito[key]=(carrito[key]||0)+delta; if(carrito[key]<=0) delete carrito[key];
  const prod = productos.find(p=>p.numero==num); renderizar(document.getElementById("buscador").value? productos.filter(p=>p.nombre.toLowerCase().includes(document.getElementById("buscador").value.toLowerCase())) : productos);
}
function filtrar(){
  const txt = document.getElementById("buscador").value.toLowerCase();
  renderizar(productos.filter(p=>p.nombre.toLowerCase().includes(txt)));
}
function actualizarTotal(){
  let total=0; let resumen="";
  for(let k in carrito){
    const [num,tipo]=k.split("-"); const p=productos.find(x=>x.numero==num); if(!p) continue;
    if(tipo=="U"){ total+=p.unidad*carrito[k]; resumen+=`${carrito[k]}x U ${p.nombre}<br>`}
    if(tipo=="F"){ const pf=Math.round(p.unidad*p.unidadesFardo*0.9); total+=pf*carrito[k]; resumen+=`${carrito[k]}x FARDO ${p.nombre}<br>`}
    if(tipo=="P"){ resumen+=`${carrito[k]}x PROMO ${p.nombre} - Consultar con vendedor<br>`}
  }
  document.getElementById("resumen").innerHTML=resumen;
  document.getElementById("total").innerHTML="<b>TOTAL (sin promos): $"+total+"</b>";
}
function confirmarEnvio(){
  let msg=`Hola! Soy ${document.getElementById("nombre").value} - Dir: ${document.getElementById("direccion").value}%0A%0APedido:%0A`;
  let total=0;
  for(let k in carrito){
    const [num,tipo]=k.split("-"); const p=productos.find(x=>x.numero==num);
    if(tipo=="U"){msg+=`• ${carrito[k]}x UNIDAD ${p.nombre} = $${p.unidad*carrito[k]}%0A`; total+=p.unidad*carrito[k]}
    if(tipo=="F"){const pf=Math.round(p.unidad*p.unidadesFardo*0.9); msg+=`• ${carrito[k]}x FARDO x${p.unidadesFardo} ${p.nombre} = $${pf*carrito[k]}%0A`; total+=pf*carrito[k]}
    if(tipo=="P"){msg+=`• ${carrito[k]}x PROMO ${p.nombre} - Consultar con el vendedor%0A`}
  }
  msg+=`%0A*TOTAL (sin promos): $${total}*%0A`;
  window.open("https://wa.me/549387XXXXXXX?text="+msg);
}
cargar();
</script>
</body>
</html>
