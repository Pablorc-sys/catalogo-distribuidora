<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Distribuidora</title>
  <style>
    body { font-family: Arial; background: #f2f2f2; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
    .producto { background: white; border-radius: 12px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .producto img { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; }
    .precio { font-size: 22px; font-weight: bold; color: #27ae60; margin: 10px 0; }
    .btn-wsp { display: inline-block; background: #25D366; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }
    .btn-wsp:hover { background: #1ebe5b; }
  </style>
</head>
<body>
  <h1>Catálogo Distribuidora</h1>
  <div class="grid">
    
    <div class="producto">
      <img src="https://via.placeholder.com/300x180.png?text=Coca+500ml" alt="Coca">
      <h3>Coca Cola 500ml</h3>
      <p class="precio">$2500</p>
      <a class="btn-wsp" href="https://wa.me/549388XXXXXXX?text=Hola! Quiero pedir 1x Coca Cola 500ml" target="_blank">Pedir por WhatsApp</a>
    </div>

    <div class="producto">
      <img src="https://via.placeholder.com/300x180.png?text=Agua+1.5L" alt="Agua">
      <h3>Agua Mineral 1.5L</h3>
      <p class="precio">$1800</p>
      <a class="btn-wsp" href="https://wa.me/549388XXXXXXX?text=Hola! Quiero pedir 1x Agua Mineral 1.5L" target="_blank">Pedir por WhatsApp</a>
    </div>

    <div class="producto">
      <img src="https://via.placeholder.com/300x180.png?text=Papas+Lays" alt="Papas">
      <h3>Papas Lays Clásicas</h3>
      <p class="precio">$3200</p>
      <a class="btn-wsp" href="https://wa.me/549388XXXXXXX?text=Hola! Quiero pedir 1x Papas Lays Clásicas" target="_blank">Pedir por WhatsApp</a>
    </div>

  </div>
</body>
</html>
