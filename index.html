<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de distribuidora - Pedidos por WhatsApp">
  <title>Catálogo Distribuidora - Salta</title>

  <!-- Hoja de estilos externa -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- ===== HEADER: logo y buscador ===== -->
  <header>
    <h1>📦 Catálogo</h1>
    <input
      id="buscador"
      type="search"
      placeholder="🔍 Buscar..."
      aria-label="Buscar productos"
    >
  </header>

  <!-- ===== CARRUSEL DE MARCAS (se llena por JS) ===== -->
  <nav id="carousel-marcas" aria-label="Filtrar por marca"></nav>

  <!-- ===== ESTADO: cuenta de productos ===== -->
  <p id="estado">Cargando...</p>

  <!-- ===== GRILLA DE PRODUCTOS (se llena por JS) ===== -->
  <main id="productos"></main>

  <!-- ===== BARRA FIJA DEL CARRITO ===== -->
  <footer id="carrito-bar">
    <div>
      🛒 <span id="carrito-count">0</span> |
      $<span id="carrito-total">0</span>
    </div>
    <button id="btn-pedir" type="button">Pedir</button>
  </footer>

  <!-- ===== MODAL DE DATOS DE ENTREGA ===== -->
  <div id="modal-datos" role="dialog" aria-modal="true" aria-labelledby="titulo-modal">
    <div class="box">
      <h3 id="titulo-modal">Datos entrega</h3>

      <input id="cli-nombre" type="text" placeholder="Nombre / Comercio *">
      <input id="cli-dire"   type="text" placeholder="Dirección *">
      <input id="cli-nota"   type="text" placeholder="Nota vendedor (opcional)">

      <button id="btn-enviar"   type="button" class="modal-btn modal-btn-primario">Enviar por WhatsApp</button>
      <button id="btn-cancelar" type="button" class="modal-btn modal-btn-secundario">Cancelar</button>
    </div>
  </div>

  <!-- Lógica externa -->
  <script src="app.js"></script>
</body>
</html>
