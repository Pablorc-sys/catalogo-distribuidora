<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Distribuidora</title>
<style>
body{font-family:Arial; background:#f4f4f4; margin:0; padding:15px; padding-bottom:90px;}
#productos{display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:15px;}
.card{background:white; border-radius:14px; padding:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); display:flex; flex-direction:column;}
.card.promo{border:2px solid #e67e22; background:#fffaf0;}
.card img{width:100%; height:160px; object-fit:contain; background:#fff; border-radius:10px;}
.btn{border:none; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer; width:100%; margin-top:6px;}
.btn-add{background:#27ae60; color:white;}
.btn-promo{background:#e67e22; color:white;}
#carrito-bar{position:fixed; bottom:0; left:0; right:0; background:#111; color:white; padding:12px 15px; display:flex; justify-content:space-between; align-items:center; z-index:999;}
#carrito-bar button{background:#25D366; color:white; border:none; padding:12px 18px; border-radius:10px; font-weight:bold; font-size:16px;}
.badge{background:#ff4757; color:white; padding:2px 6px; border-radius:50%; font-size:12px;}
.qty{display:flex; justify-content:space-between; align-items:center; background:#f1f2f6; border-radius:8px; padding:5px; margin-top:6px;}
#carousel-marcas::-webkit-scrollbar { display: none; }
#carousel-marcas {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 0;
  margin-bottom: 15px;
  scrollbar-width: none;
}
.marca-btn {
  background: white;
  border: 2px solid #ddd;
  border-radius: 20px;
  padding: 8px 14px;
  white-space: nowrap;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  color: #333;
  transition: all 0.2s;
}
.marca-btn:hover, .marca-btn.activo {
  background: #111;
  color: white;
  border-color: #111;
}
.badge-promo {
  background: #e67e22; color: white; padding: 3px 8px;
  border-radius: 20px; font-size: 12px; width: fit-content;
}
.stock.sin { color: #c0392b; font-weight: bold; }
.stock.pocas { color: #e67e22; font-weight: bold; }
.precios { font-size: 13px; margin: 6px 0; }
.qty { display: flex; align-items: center; gap: 8px; margin: 6px 0; justify-content: center; }
.qty button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid #ccc; background: white; cursor: pointer; font-weight: bold; }
.qty span { min-width: 24px; text-align: center; font-weight: bold; }
.btn-add { width: 100%; padding: 8px; background: #25D366; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
.btn-sin-stock { width: 100%; padding: 8px; background: #ccc; color: white; border: none; border-radius: 8px; }
</style>
</head>
<body>
<h1 style="text-align:center;">Catálogo Mayorista</h1>
  <!-- Carrusel de marcas -->
<div id="carousel-marcas" style="display:flex; gap:10px; overflow-x:auto; padding:10px 0; margin-bottom:15px;">
  <!-- Los botones de marca se generarán dinámicamente con JavaScript -->
</div>
<p style="text-align:center;" id="estado">Cargando...</p>
<div id="productos"></div>

<div id="carrito-bar">
  <div>🛒 <span id="carrito-count">0</span> productos - Total: $<span id="carrito-total">0</span></div>
  <button onclick="enviarPedido()">Enviar por WhatsApp</button>
</div>

<script>
const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTY7KHsuN6HDxt-xp4mH52cU_iW0x9yJB043eVr9lw8tcASVJeyoMq7lwCl2J6WTM_nBQQz-PgQVxFU/pub?output=csv";
const WHATSAPP = "5493874836526";

let todosLosProductos = [];
let marcaActual = "todas";
const carrito = {};

fetch(URL_CSV)
  .then(r => r.text())
  .then(text => {
    const filas = text.split("\n");
    todosLosProductos = [];

    for (let i = 1; i < filas.length; i++) {
      const c = filas[i].split(/,(?=(?:(?:[^"]"){2})[^"]*$)/);
      if (c.length < 7) continue;

      const limpiar = (v) => (v || "").replace(/"/g, "").trim();

      let marca   = limpiar(c[0]) || "Otros";
      const numero  = limpiar(c[1]);
      const nombre  = limpiar(c[2]);
      let cant    = parseInt(c[3]) || 0;
      const precio  = parseFloat(c[4]) || 0;
      const uniCaja = parseInt(c[5]) || 1;
      const precioCaja = parseFloat(c[6]) || precio;
      const imagen  = limpiar(c[7]) || https://placehold.co/300x200?text=${encodeURIComponent(nombre.slice(0,20))};

      if (!nombre || nombre.toLowerCase() === "nombre") continue;
      if (cant < 0) cant = 0; // stocks negativos = sin stock

      todosLosProductos.push({
        marca, numero, nombre, cant, precio, uniCaja, precioCaja, imagen
      });
    }

    // Generar botones de marca en el carrusel
    const marcasUnicas = [...new Set(todosLosProductos.map(p => p.marca))].sort();
    const carousel = document.getElementById("carousel-marcas");
    if (carousel) {
      carousel.innerHTML = <button class="marca-btn activo" onclick="filtrarPorMarca('todas')">Todas (${todosLosProductos.length})</button>;
      marcasUnicas.forEach(m => {
        const count = todosLosProductos.filter(p => p.marca === m).length;
        carousel.innerHTML += <button class="marca-btn" onclick="filtrarPorMarca('${m.replace(/'/g, "\\'")}')">${m} (${count})</button>;
      });
    }

    renderizarProductos(todosLosProductos);
    const estado = document.getElementById("estado");
    if (estado) estado.innerHTML = "";
  })
  .catch(err => {
    console.error("Error al leer CSV:", err);
    const estado = document.getElementById("estado");
    if (estado) estado.innerHTML = "Error al cargar productos.";
  });

  function formatoPrecio(n) {
  return n.toLocaleString('es-AR', { maximumFractionDigits: 0 });
}

function renderizarProductos(productos) {
  const cont = document.getElementById("productos");
  if (!cont) return;
  cont.innerHTML = "";

  if (productos.length === 0) {
    cont.innerHTML = "<p style='text-align:center;padding:20px;'>No hay productos en esta marca.</p>";
    return;
  }

  productos.forEach(p => {
    const esPromo = /promo|oferta/i.test(p.nombre);
    const qtyActual = carrito[p.nombre]?.qty || 0;
    const sinStock = p.cant <= 0;
    const pocas = p.cant > 0 && p.cant <= 10;
    const descuentoFardo = p.uniCaja > 1 && p.precioCaja < p.precio;

    cont.innerHTML += `
      <div class="card ${esPromo ? 'promo' : ''}">
        ${esPromo ? '<span class="badge-promo">🔥 PROMO</span>' : ''}
        <img src="${p.imagen}" onerror="this.src='https://placehold.co/300?text=Sin+Foto'">
        <small style="color:#888;">Cod. ${p.numero}</small>
        <h3>${p.nombre}</h3>
        <small class="stock ${sinStock?'sin': pocas?'pocas':''}">
          Stock: ${p.cant} ${sinStock?'❌ SIN STOCK': pocas?'⚠️ Pocas!':''}
        </small>
        <div class="precios">
          <div><b>Unitario:</b> $${formatoPrecio(p.precio)}</div>
          ${p.uniCaja > 1 ? <div><b>Fardo x${p.uniCaja}:</b> $${formatoPrecio(p.precioCaja)} c/u ${descuentoFardo?'<span style="color:#25D366;">(-10%)</span>':''}</div> : ''}
        </div>
        ${!sinStock ? `
          <div class="qty">
            <button onclick="cambiar('${p.nombre.replace(/'/g,"\\'")}', -1, ${p.precio})">-</button>
            <span id="q-${p.numero}">${qtyActual}</span>
            <button onclick="cambiar('${p.nombre.replace(/'/g,"\\'")}', 1, ${p.precio})">+</button>
          </div>
          <button class="btn btn-add" onclick="cambiar('${p.nombre.replace(/'/g,"\\'")}', 1, ${p.precio})">Agregar</button>
        ` : <button disabled class="btn-sin-stock">Sin Stock</button>}
      </div>`;
  });
}

function filtrarPorMarca(marca) {
  marcaActual = marca;

  document.querySelectorAll('.marca-btn').forEach(btn => {
    const texto = btn.textContent.trim();
    const activo = (marca === 'todas' && texto.startsWith('Todas'))
                || texto.startsWith(marca + ' ');
    btn.classList.toggle('activo', activo);
  });

  const filtrados = marca === 'todas'
    ? todosLosProductos
    : todosLosProductos.filter(p => p.marca === marca);

  renderizarProductos(filtrados);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cambiar(nombre, delta, precio) {
  carrito[nombre] = carrito[nombre] || { qty: 0, precio: parseFloat(precio) || 0 };
  carrito[nombre].qty += delta;
  if (carrito[nombre].qty <= 0) delete carrito[nombre];

  // Actualizar todos los contadores visibles con ese nombre
  const producto = todosLosProductos.find(p => p.nombre === nombre);
  if (producto) {
    const span = document.getElementById(q-${producto.numero});
    if (span) span.innerText = carrito[nombre]?.qty || 0;
  }

  actualizarBarraCarrito();
}

function actualizarBarraCarrito() {
  let totalItems = 0, totalPrecio = 0;
  for (const nombre in carrito) {
    totalItems += carrito[nombre].qty;
    totalPrecio += carrito[nombre].qty * carrito[nombre].precio;
  }
  const countEl = document.getElementById("carrito-count");
  const totalEl = document.getElementById("carrito-total");
  if (countEl) countEl.innerText = totalItems;
  if (totalEl) totalEl.innerText = formatoPrecio(totalPrecio);
}
  
function enviarPedido() {
  if (Object.keys(carrito).length === 0) {
    alert("El carrito está vacío");
    return;
  }

  let mensaje = "PEDIDO - Catálogo Distribuidora%0A";
  mensaje += Fecha: ${new Date().toLocaleDateString('es-AR')}%0A%0A;

  let total = 0;
  for (const nombre in carrito) {
    const item = carrito[nombre];
    const subtotal = item.qty * item.precio;
    total += subtotal;
    mensaje += • ${item.qty}x ${nombre} = $${formatoPrecio(subtotal)}%0A;
  }

  mensaje += %0A*TOTAL: $${formatoPrecio(total)}*;

  const url = https:/wa.me/5493874836526?text=${mensaje};
  window.open(url, '_blank');
}

  window.open(`https://wa.me/${WHATSAPP}?text=${mensaje}`, "_blank");

</script>
</body>
</html>
